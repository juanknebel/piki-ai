name: CI

# Runs ONLY on version tags vX.Y.Z (e.g. v0.5.0) — not on branch pushes or PRs.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write   # needed to create releases on tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL dev
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Run test suite
        run: make test

  static-binaries:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Build inside Alpine (musl + static OpenSSL) — one container per arch.
      # No external toolchain download; the amd64 runner executes the i386
      # container natively. Matches `make static` from the Makefile.
      - name: Build static binaries (musl)
        run: |
          mkdir -p dist
          build() {  # $1 arch  $2 image  $3 platform
            docker run --rm --platform "$3" -v "$PWD":/src -w /src "$2" sh -c '
              apk add --no-cache gcc make musl-dev openssl-dev \
                openssl-libs-static zlib-static pkgconf binutils &&
              make clean &&
              make static LIBS="$(pkg-config --static --libs openssl)" &&
              strip build/piki-static'
            cp build/piki-static "dist/piki-linux-$1"
          }
          build x86_64 alpine:3.20      linux/amd64
          build i686   i386/alpine:3.20 linux/386

      - name: Smoke test
        run: |
          file dist/piki-linux-x86_64 | grep -q 'ELF 64-bit.*statically linked'
          file dist/piki-linux-i686   | grep -q 'ELF 32-bit.*statically linked'
          ./dist/piki-linux-x86_64 --version
          ./dist/piki-linux-i686 --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piki-linux-binaries
          path: dist/piki-linux-*

  # Native Haiku build inside a QEMU VM. The binary links dynamically against
  # Haiku's own libs (libssl from the openssl3 package, libnetwork), so the
  # target system needs `pkgman install openssl3` — no static musl trick here.
  haiku-binary:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build on Haiku r1beta5 (x86-64)
        uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta5'
          run: |
            uname -a
            pkgman install -y openssl3_devel
            make
            strip build/piki
            ./build/piki --version

      - name: Collect binary
        run: |
          mkdir -p dist
          cp build/piki dist/piki-haiku-x86_64
          file dist/piki-haiku-x86_64 | grep -q 'ELF 64-bit'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piki-haiku-binary
          path: dist/piki-haiku-*

  release:
    runs-on: ubuntu-latest
    needs: [static-binaries, haiku-binary]
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/piki-linux-x86_64 dist/piki-linux-i686 dist/piki-haiku-x86_64 \
            --title "$GITHUB_REF_NAME" --generate-notes
