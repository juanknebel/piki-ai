name: Haiku

# Native Haiku build inside a QEMU VM (cross-platform-actions). Runs on the
# same version tags as the release CI (plus on demand), but as a separate
# workflow so it never gates the release itself.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build on Haiku r1beta5 (x86-64)
        uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta5'
          run: |
            uname -a
            pkgman install -y openssl3_devel
            make
            ./build/piki --version
